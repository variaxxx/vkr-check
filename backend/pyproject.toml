[project]
name = "vkr-check"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "httpx (>=0.28.1,<0.29.0)",
    "cachetools (>=6.2.4,<7.0.0)",
    "python-jose[pycryptodome] (>=3.5.0,<4.0.0)",
    "aio-pika (>=9.5.8,<10.0.0)",
    "dishka (>=1.7.2,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["W", "E", "I"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "alembic (>=1.18.1,<2.0.0)",
    "ruff (>=0.14.13,<0.15.0)"
]

[tool.poetry]
package-mode = false
