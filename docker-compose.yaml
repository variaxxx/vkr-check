version: "3.9"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "su -c 'pg_isready -U postgres' postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - "${POSTGRES_PORT}:5432"

  minio:
    image: minio/minio:latest
    volumes:
      - ./s3/data:/data
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_PANEL_PORT}:9001
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: false
    command: server --console-address ":9001" /data/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend

  keycloak:
    image: keycloak/keycloak:26.3.2
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${KC_PORT}:8080"
    command:
      - start-dev
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RMQ_PORT}:5672"
      - "${RMQ_PANEL_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /celery
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  backend:
    container_name: vkr-check-backend
    build: ./backend
    restart: unless-stopped
    command: uvicorn src.main:app --host=0.0.0.0 --port=8000
    env_file:
      - ./backend/.env.production
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "${BACKEND_PORT}:8000"
    networks:
      - backend

  worker:
    container_name: vkr-check-worker
    build: ./worker
    restart: unless-stopped
    env_file:
      - ./worker/.env.production
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_DIR: ${MODEL_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend
      - llm_shared_network
    volumes:
      - ./worker/oauth_client.json:/app/oauth_client.json
      - ./worker/token.json:/app/token.json

  frontend:
    container_name: vkr-check-frontend
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - backend

  nginx:
    container_name: vkr-check-nginx
    image: nginx:stable-alpine
    restart: on-failure
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
      - frontend
      - backend
    networks:
      - backend

include:
  - path: docker-compose.ollama.yaml
  - path: docker-compose.vllm.yaml

networks:
  backend:
  llm_shared_network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  rabbitmq_data: