<div class="w-64 max-md:w-20.5 bg-white h-full border-r-2 border-neutral-200">
  <div class="p-4 border-b-2 border-neutral-200 flex items-center gap-3">
    <app-icon icon="logo" class="text-transparent h-11.5 w-11.5"></app-icon>
    <h1 class="font-medium text-lg max-md:hidden text-neutral-900">Навигация</h1>
  </div>

  <nav class="p-4 flex flex-col gap-2">
    @for (route of routes; track $index) {
      <div
        class="flex items-center gap-3 cursor-pointer w-full p-3 rounded-lg hover:bg-neutral-50 transition-colors text-neutral-900" [routerLink]="route.route"
        routerLinkActive="active-route"
        >
        <app-icon [icon]="route.icon" class="text-neutral-400 h-6 w-6"></app-icon>
        <p class="font-medium select-none max-md:hidden">
          {{route.label}}
        </p>
      </div>
    }
  </nav>
</div>
