[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "celery (>=5.6.2,<6.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "dishka (>=1.7.2,<2.0.0)",
    "langchain-openai (>=1.1.7,<2.0.0)",
    "pypdf (>=6.6.2,<7.0.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "langchain (>=1.2.7,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-huggingface (>=1.2.0,<2.0.0)",
    "sentence-transformers (>=5.2.2,<6.0.0)",
    "supervision (>=0.27.0,<0.28.0)",
    "ultralytics (>=8.4.11,<9.0.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["W", "E", "I"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poetry]
package-mode = false
